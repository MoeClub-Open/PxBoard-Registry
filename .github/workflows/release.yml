name: Publish plugin registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example plugins-2026.10.26
        required: true
        type: string
      core_ref:
        description: PxBoard SDK revision
        default: v0.2.0
        type: string
      plugins_ref:
        description: Official plugins revision
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: PxBoard-Registry
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: MoeClub-Open/PxBoard
          ref: ${{ inputs.core_ref }}
          path: PxBoard
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: MoeClub-Open/PxBoard-Plugins
          ref: ${{ inputs.plugins_ref }}
          path: PxBoard-Plugins
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: PxBoard-Plugins/go.mod
          cache-dependency-path: |
            PxBoard/go.sum
            PxBoard-Plugins/go.sum
      - name: Build plugin packages
        working-directory: PxBoard-Registry
        run: |
          for platform in linux-amd64 linux-arm64 windows-amd64; do
            go run ./cmd/publish -platform "$platform" -artifact-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          done
      - name: Upload release
        working-directory: PxBoard-Registry
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$RELEASE_TAG" --notes "Official PxBoard plugins for Linux amd64, Linux arm64, and Windows amd64."
          fi
          gh release upload "$RELEASE_TAG" index.json packages/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Update source index
        working-directory: PxBoard-Registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${RELEASE_TAG} plugin index"
            git push origin HEAD:main
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
